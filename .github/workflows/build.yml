name: Build and publish image to ghcr.io/epics-containers

on:
  push:
  pull_request:

env:
  # image names, -developer or -runtime is appended to these
  NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    # pull requests are a duplicate of a branch push if within the same repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # each platform builds and tests natively on its own runner, then the
        # merge job combines them into a single multi-arch tag
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Platform name
        id: platform
        run: echo "pair=$(echo ${{ matrix.platform }} | tr / -)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: runtime
          build-args: |
            IOC_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
          tags: ci_test
          load: true

      - name: Test image
        run: tests/run-tests.sh ci_test

      - name: Require released ibek-support on release tags
        # A released image pins ibek-support by commit hash only, so that commit
        # must be reachable from the ibek-support default branch or the image
        # cannot be rebuilt from its source later. Pre-release tags are exempt,
        # so work in progress can still be published.
        # see https://github.com/epics-containers/ibek-support/issues/17
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # PEP440 (2025.12.1b1) and semver (2025.12.1-beta.1) pre-release styles
          # are both in use across generic IOCs, so accept either.
          case "${TAG}" in
              *a[0-9]*|*b[0-9]*|*rc[0-9]*|*alpha*|*beta*|*rc.[0-9]*)
                  echo "::notice::pre-release tag ${TAG}, skipping ibek-support branch check"
                  exit 0
                  ;;
          esac
          modules=$(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' || true)
          status=0
          for sub in $(echo "${modules}" | cut -s -d' ' -f2); do
              case "${sub}" in ibek-support*) ;; *) continue ;; esac
              # the submodule is checked out detached, so find its default
              # branch and fetch it before asking about ancestry
              branch=$(git -C "${sub}" ls-remote --symref origin HEAD |
                  sed -n 's|^ref:[[:space:]]*refs/heads/\([^[:space:]]*\).*|\1|p')
              branch=${branch:-main}
              # actions/checkout clones submodules shallow, so the ancestry
              # walk needs the full history of that branch
              if [ "$(git -C "${sub}" rev-parse --is-shallow-repository)" = true ]; then
                  git -C "${sub}" fetch --no-tags --unshallow origin "${branch}"
              else
                  git -C "${sub}" fetch --no-tags origin "${branch}"
              fi
              sha=$(git -C "${sub}" rev-parse --short HEAD)
              if git -C "${sub}" merge-base --is-ancestor HEAD FETCH_HEAD; then
                  echo "${sub} ${sha} is on ${branch}"
              else
                  echo "::error::${sub} ${sha} is not on ${branch}. Merge it to"\
                      "${branch}, update the submodule and re-tag, or publish"\
                      "this as a pre-release tag (e.g. ${TAG}-beta.1)."
                  status=1
              fi
          done
          exit ${status}

      - name: Push images by digest
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          IOC_VERSION: ${{ github.ref_name }}
        run: |
          # the builder cache from the build step makes these quick
          for target in developer runtime; do
            docker buildx build . --platform ${PLATFORM} --target ${target} \
              --build-arg IOC_VERSION=${IOC_VERSION} \
              --output type=image,name=${NAME}-${target},push-by-digest=true,name-canonical=true,push=true \
              --metadata-file /tmp/${target}.json
            digest=$(jq -r '."containerimage.digest"' /tmp/${target}.json)
            mkdir -p /tmp/digests/${target}
            touch /tmp/digests/${target}/${digest#sha256:}
          done

      - name: Upload digests
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # combine the per-platform images into multi-arch tags
    needs: [build]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        target: [developer, runtime]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ matrix.target }}
        run: |
          image=${NAME}-${{ matrix.target }}
          docker buildx imagetools create -t ${image}:${{ github.ref_name }} \
            $(printf "${image}@sha256:%s " *)
          docker buildx imagetools inspect ${image}:${{ github.ref_name }}

  release:
    # Release on tag push - publish ioc schema
    needs: [merge]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    # this job runs in the native developer container we just made
    container:
      image: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-developer:${{ github.ref_name }}

    steps:
      - name: generate-schema
        run: |
          ibek ioc generate-schema --output ibek.ioc.schema.json

      - name: copy versions manifest
        run: |
          cp /epics/versions.json versions.json

      - name: Detect pre-release tag
        # same pre-release patterns as the "Require released ibek-support" step,
        # so pre-release tags never become the "Latest" GitHub release
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "${TAG}" in
              *a[0-9]*|*b[0-9]*|*rc[0-9]*|*alpha*|*beta*|*rc.[0-9]*)
                  echo "prerelease=true" >> "${GITHUB_OUTPUT}" ;;
              *)
                  echo "prerelease=false" >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Github Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          files: |
            ibek.ioc.schema.json
            versions.json
          generate_release_notes: true
