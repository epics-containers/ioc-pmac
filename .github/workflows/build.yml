name: Build and publish image to ghcr.io/epics-containers

on:
  push:
  pull_request:

jobs:
  build:
    # pull requests are a duplicate of a branch push if within the same repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        epics-target: [linux-x86_64] # , linux-aarch64]
        include:
          - os: ubuntu-latest # everyone is on ubuntu-latest
          - epics-target: linux-x86_64
            extension: ""
            platform: linux/amd64

          # # a temporary name until multi-arch is supported
          # - epics-target: linux-aarch64
          #     extension: -native-aarch64
          #     platform: linux/arm64

    runs-on: ${{ matrix.os }}
    outputs:
      developer-tag: ${{ steps.meta-developer.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: runtime
          build-args: |
            IMAGE_EXT=${{ matrix.extension }}
            IOC_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.epics-target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.epics-target }}
          tags: ci_test
          load: true

      - name: Test image
        # can't test non native without some hardware to run on
        if: ${{ matrix.epics-target == 'linux-x86_64' }}
        run: tests/run-tests.sh ci_test

      - name: Require released ibek-support on release tags
        # A released image pins ibek-support by commit hash only, so that commit
        # must be reachable from the ibek-support default branch or the image
        # cannot be rebuilt from its source later. Pre-release tags are exempt,
        # so work in progress can still be published.
        # see https://github.com/epics-containers/ibek-support/issues/17
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # PEP440 (2025.12.1b1) and semver (2025.12.1-beta.1) pre-release styles
          # are both in use across generic IOCs, so accept either.
          case "${TAG}" in
              *a[0-9]*|*b[0-9]*|*rc[0-9]*|*alpha*|*beta*|*rc.[0-9]*)
                  echo "::notice::pre-release tag ${TAG}, skipping ibek-support branch check"
                  exit 0
                  ;;
          esac
          modules=$(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' || true)
          status=0
          for sub in $(echo "${modules}" | cut -s -d' ' -f2); do
              case "${sub}" in ibek-support*) ;; *) continue ;; esac
              # the submodule is checked out detached, so find its default
              # branch and fetch it before asking about ancestry
              branch=$(git -C "${sub}" ls-remote --symref origin HEAD |
                  sed -n 's|^ref:[[:space:]]*refs/heads/\([^[:space:]]*\).*|\1|p')
              branch=${branch:-main}
              # actions/checkout clones submodules shallow, so the ancestry
              # walk needs the full history of that branch
              if [ "$(git -C "${sub}" rev-parse --is-shallow-repository)" = true ]; then
                  git -C "${sub}" fetch --no-tags --unshallow origin "${branch}"
              else
                  git -C "${sub}" fetch --no-tags origin "${branch}"
              fi
              sha=$(git -C "${sub}" rev-parse --short HEAD)
              if git -C "${sub}" merge-base --is-ancestor HEAD FETCH_HEAD; then
                  echo "${sub} ${sha} is on ${branch}"
              else
                  echo "::error::${sub} ${sha} is not on ${branch}. Merge it to"\
                      "${branch}, update the submodule and re-tag, or publish"\
                      "this as a pre-release tag (e.g. ${TAG}-beta.1)."
                  status=1
              fi
          done
          exit ${status}

      - name: Developer target metadata
        id: meta-developer
        uses: docker/metadata-action@v3
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.extension }}-developer
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Push developer image
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: developer
          build-args: |
            IMAGE_EXT=${{ matrix.extension }}
            IOC_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-developer.outputs.tags }}
          labels: ${{ steps.meta-developer.outputs.labels }}
          push: true

      - name: Runtime target metadata
        id: meta-runtime
        uses: docker/metadata-action@v3
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}${{ matrix.extension }}-runtime
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Push runtime image
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: runtime
          build-args: |
            IMAGE_EXT=${{ matrix.extension }}
            IOC_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          push: true

  release:
    # Release on tag push - publish ioc schema
    needs: [build]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    # this job runs in the native developer container we just made
    container:
      image: ${{ needs.build.outputs.developer-tag }}

    steps:
      - name: report container tag name
        run: |
          echo developer container image tag is ${{ needs.build.outputs.developer-tag }}

      - name: generate-schema
        run: |
          ibek ioc generate-schema --output ibek.ioc.schema.json

      - name: copy versions manifest
        run: |
          cp /epics/versions.json versions.json

      - name: Github Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          files: |
            ibek.ioc.schema.json
            versions.json
          generate_release_notes: true
